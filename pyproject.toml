[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "focal-stress"
version = "1.0.0"
description = "Infer stress from earthquake focal mechanisms when the true fault plane is unknown"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ben Jahnke"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
focal-stress = "focal_stress.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["focal_stress"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
